name: Build macOS app

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install build and video-test dependencies
        run: brew install python@3.14 ffmpeg
      - name: Select the same Python distribution as local builds
        run: |
          echo "PYTHON=$(brew --prefix python@3.14)/bin/python3.14" >> "$GITHUB_ENV"
          echo "$(brew --prefix python@3.14)/libexec/bin" >> "$GITHUB_PATH"
      - name: Source privacy audit
        run: python3 scripts/privacy_audit.py --tree .
      - name: Git history privacy audit
        run: python3 scripts/privacy_audit.py .
      - name: Build and test native application
        run: bash scripts/build_app.sh
      - name: Worker regression tests
        run: .build-tools/bin/python -m unittest discover -s worker/tests -v
      - name: Package
        run: bash scripts/package_release.sh
      - name: Upload installation packages
        uses: actions/upload-artifact@v4
        with:
          name: Qisheng-Recorder-macOS-${{ runner.arch }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/SHA256SUMS.txt
          retention-days: 14
